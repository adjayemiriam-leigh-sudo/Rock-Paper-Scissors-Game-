<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        /* little pop animation when the pictures change (the JS adds the "pop" class) */
        .pop {
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-[#FAF7F2] text-center text-[#241832] min-h-screen flex items-center justify-center px-4 py-10">
    <main class="w-full max-w-2xl bg-white rounded-3xl shadow-sm border border-[#241832]/10 p-8 text-center">
        <!-- Game Title -->
        <h1 class="font-serif text-5xl mb-1">Rock Paper Scissors</h1>
        <p class="text-[#241832]/60">Pick one and beat your opponent the computer!</p>
        <p id="round-info" class="text-sm text-[#241832]/60 mt-1">First to 10 wins!</p>

        <!-- Scoreboard -->
        <div class="grid grid-cols-3 gap-3 mt-8 mb-8">
            <div class="bg-[#7C9473]/10 rounded-2xl py-3">
                <p class="text-sm text-[#241832]/60">You</p>
                <p id="player-score" class="font-serif text-3xl text-[#7C9473]">0</p>
            </div>
            <div class="bg-[#D9A441]/10 rounded-2xl py-3">
                <p class="text-sm text-[#241832]/60">Draws</p>
                <p id="draw-score" class="font-serif text-3xl text-[#D9A441]">0</p>
            </div>
            <div class="bg-[#E8646F]/10 rounded-2xl py-3">
                <p class="text-sm text-[#241832]/60">Computer</p>
                <p id="computer-score" class="font-serif text-3xl text-[#E8646F]">0</p>
            </div>
        </div>

        <!-- Game play area -->
        <div class="flex items-center justify-around mb-4">
            <div>
                <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-3xl bg-[#FAF7F2] flex items-center justify-center">
                    <span id="player-placeholder" class="font-serif text-5xl text-[#241832]/20">?</span>
                    <img id="player-pic" src="" alt="Your choice" class="hidden w-full h-full p-3">
                </div>
                <p class="font-serif text-base mt-2">You</p>
            </div>

            <p class="font-serif text-2xl text-[#241832]/30">vs</p>

            <div>
                <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-3xl bg-[#FAF7F2] flex items-center justify-center">
                    <span id="computer-placeholder" class="font-serif text-5xl text-[#241832]/20">?</span>
                    <img id="computer-pic" src="" alt="Computer's choice" class="hidden w-full h-full p-3">
                </div>
                <p class="font-serif text-base mt-2">Computer</p>
            </div>
        </div>

        <!-- Result message -->
        <p id="result" class="font-serif text-3xl min-h-20 mb-6">Make your move!</p>

        <!-- Rock, Paper, Scissors buttons -->
        <div id="choice-area" class="flex justify-center gap-4 mb-6">
            <button data-choice="rock"
                class="choice-btn w-24 h-24 sm:w-28 sm:h-28 rounded-3xl border border-[#241832]/15 bg-white hover:border-[#E8646F] hover:-translate-y-1 transition-all">
                <img src="Images/rock.svg" alt="Rock" class="w-full h-full p-3">
            </button>
            <button data-choice="paper"
                class="choice-btn w-24 h-24 sm:w-28 sm:h-28 rounded-3xl border border-[#241832]/15 bg-white hover:border-[#E8646F] hover:-translate-y-1 transition-all">
                <img src="Images/paper.svg" alt="Paper" class="w-full h-full p-3">
            </button>
            <button data-choice="scissors"
                class="choice-btn w-24 h-24 sm:w-28 sm:h-28 rounded-3xl border border-[#241832]/15 bg-white hover:border-[#E8646F] hover:-translate-y-1 transition-all">
                <img src="Images/scissors.svg" alt="Scissors" class="w-full h-full p-3">
            </button>
        </div>

        <!-- Reset Game Button -->
        <button id="reset-btn"
            class="bg-[#E8646F]/60 font-serif text-white font-semibold px-6 py-2 rounded-3xl hover:bg-[#D94C5A] transition-all">Reset
            Game</button>

    </main>

    <script src="script.js"></script>
</body>

</html>
